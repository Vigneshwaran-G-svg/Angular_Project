<div class="min-h-screen bg-gray-100 p-6">

  <div class="bg-white shadow-lg rounded-2xl p-6 max-w-8xl mx-auto mb-6">

    <div class="flex flex-col lg:flex-row lg:items-center">

      <div>
        <h3 class="text-2xl font-bold text-gray-800">
          Product List
        </h3>
        <p class="text-gray-500 mt-1">
          Browse and filter your products
        </p>
      </div>


      <div class="flex items-center gap-3 mt-4 lg:mt-0 lg:ml-auto">


        <select
          class="border border-gray-300 px-4 py-2 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-400"
          [(ngModel)]="selectedCategory"
          (change)="applyFilter()"
        >
          <option value="">All Categories</option>
          <option *ngFor="let c of categories" [value]="c">
            {{ c }}
          </option>
        </select>

     
        <select
          class="border border-gray-300 px-4 py-2 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-400"
          [(ngModel)]="sortOrder"
          (change)="applyFilter()"
        >
          <option value="">Sort by Price</option>
          <option value="low">Low → High</option>
          <option value="high">High → Low</option>
        </select>

      
        <button
          (click)="goHome()"
          class="bg-black -600 hover:bg-black -700 text-white px-5 py-2 rounded-xl shadow"
        >
          ← Back
        </button>

      </div>
    </div>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 max-w-8xl mx-auto">

    <div
      *ngFor="let p of filteredProducts"
      class="bg-white rounded-2xl shadow-md hover:shadow-xl transition duration-300 p-5"
    >

  
      <div class="bg-gray-100 rounded-xl p-4 h-52 flex items-center justify-center">
        <img
          [src]="p.image"
          class="h-40 object-contain hover:scale-105 transition"
        />
      </div>


      <div class="mt-4">

        <h3 class="font-semibold text-gray-800 line-clamp-2 h-12">
          {{ p.title }}
        </h3>

        <div class="flex items-center justify-between mt-3">

          <p class="text-2xl font-bold text-green-600">
            ₹ {{ p.price }}
          </p>

          <span class="bg-blue-100 text-blue-700 text-xs px-3 py-1 rounded-full">
            {{ p.category }}
          </span>

<div class="flex items-center gap-1">

  <ng-container *ngFor="let star of [1,2,3,4,5]">

    <span
      [class.text-yellow-500]="star <= p.rating.rate"
      [class.text-gray-300]="star > p.rating.rate"
      class="text-xl"
    >
      ★
    </span>

  </ng-container>


  <span class="ml-2 text-sm font-semibold text-gray-700">
    {{ p.rating.rate }}
  </span>

</div>
        </div>

      

      </div>
      

    </div>

  </div>

</div>
